<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11100f" />
    <meta
      name="description"
      content="ミリしらソード — PCとスマートフォンで遊べるゲーム"
    />
    <title>ミリしらソード</title>
  </head>
  <body>
    <main class="game-shell" id="game-shell">
      <header class="game-header">
        <div class="game-title-row">
          <h1>ミリしらソード</h1>
          <p class="stage-label" data-stage-label>STAGE 1 / 4　「MOON」</p>
          <p class="sword-label" data-sword-label>剣：かな</p>
        </div>
        <div class="game-header-tools">
          <p class="keyboard-guide" aria-label="キーボード操作">
            <span>MOVE&nbsp; WASD / ↑↓←→</span>
            <span>SWORD&nbsp; SPACE</span>
            <span>MODE&nbsp; E / ENTER</span>
            <span>RESET&nbsp; R</span>
          </p>
          <button
            class="header-reset"
            type="button"
            data-control="reset"
            aria-label="現在のステージをリセット"
          >
            リセット
          </button>
          <a class="editor-link" href="?editor=1" data-editor-link>EDITOR</a>
        </div>
        <p class="goal-label" data-goal-label>
          英語剣へ切り替え、月の名前を右の壁へ押しつける
        </p>
      </header>

      <section class="stage-frame" aria-label="ゲーム画面">
        <canvas id="game-canvas" tabindex="0">
          このブラウザはCanvasに対応していません。
        </canvas>
      </section>

      <section class="touch-controls" aria-label="ゲーム操作">
        <div class="d-pad" aria-label="方向ボタン">
          <button class="control-button direction up" data-control="up" aria-label="上">
            <span aria-hidden="true">↑</span>
          </button>
          <button class="control-button direction left" data-control="left" aria-label="左">
            <span aria-hidden="true">←</span>
          </button>
          <button class="control-button direction down" data-control="down" aria-label="下">
            <span aria-hidden="true">↓</span>
          </button>
          <button class="control-button direction right" data-control="right" aria-label="右">
            <span aria-hidden="true">→</span>
          </button>
          <span class="d-pad-center" aria-hidden="true"></span>
        </div>

        <div class="action-pad" aria-label="アクションボタン">
          <button
            class="control-button action action-secondary"
            type="button"
            data-control="switch"
            aria-label="かな剣と英語剣を切り替える"
          >
            <span>切替</span>
          </button>
          <button
            class="control-button action action-primary"
            type="button"
            data-control="primary"
            aria-label="剣を振る"
          >
            <span>剣</span>
          </button>
        </div>
      </section>
    </main>

    <div id="editor-root" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
