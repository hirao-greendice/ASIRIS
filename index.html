<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#241f38" />
    <title>きりもじ - Stage 01</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="きりもじ パズルゲーム">
      <section class="stage-panel" aria-label="ステージエリア">
        <div class="board-frame">
          <div id="board" class="board" role="grid" aria-label="7かける8マスのステージ"></div>
        </div>
      </section>

      <section class="control-panel" aria-label="操作UI">
        <div class="inventory-panel">
          <span class="inventory-heading">文字</span>
          <div id="inventory" class="inventory" aria-label="所持文字一覧"></div>
        </div>

        <p id="message" class="message" aria-live="polite">十字キーで、オブジェクトのとなりへ</p>

        <div class="controller">
          <div class="dpad" aria-label="十字キー">
            <button class="control-button dpad-up" type="button" data-direction="up" aria-label="上へ移動">
              <img src="アセット 1.png" alt="" draggable="false" />
            </button>
            <button class="control-button dpad-left" type="button" data-direction="left" aria-label="左へ移動">
              <img src="アセット 1.png" alt="" draggable="false" />
            </button>
            <div class="dpad-center" aria-hidden="true"></div>
            <button class="control-button dpad-right" type="button" data-direction="right" aria-label="右へ移動">
              <img src="アセット 1.png" alt="" draggable="false" />
            </button>
            <button class="control-button dpad-down" type="button" data-direction="down" aria-label="下へ移動">
              <img src="アセット 1.png" alt="" draggable="false" />
            </button>
          </div>

          <div class="action-buttons" aria-label="アクションボタン">
            <button id="button-a" class="action-button button-a" type="button" aria-label="Aボタン">
              <img src="アセット 2.png" alt="" draggable="false" />
            </button>
            <button id="button-b" class="action-button button-b" type="button" aria-label="Bボタン 切るまたは調べる">
              <img src="アセット 3.png" alt="" draggable="false" />
            </button>
          </div>
        </div>
      </section>
    </main>

    <div id="puzzle-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <section class="puzzle-card" role="dialog" aria-modal="true" aria-labelledby="puzzle-title">
        <button id="close-puzzle" class="close-button" type="button" aria-label="ナゾを閉じる">×</button>
        <p class="puzzle-kicker">OBJECT PUZZLE</p>
        <div id="puzzle-icon" class="puzzle-icon" aria-hidden="true"></div>
        <h2 id="puzzle-title">木のナゾ</h2>
        <p id="puzzle-clue" class="puzzle-clue"></p>

        <div id="answer-slots" class="answer-slots" aria-label="回答欄"></div>
        <p class="answer-caption">文字をタップして こたえをつくろう</p>
        <div id="puzzle-inventory" class="puzzle-inventory" aria-label="回答に使える文字"></div>

        <div class="puzzle-actions">
          <button id="delete-letter" class="secondary-button" type="button">1文字もどす</button>
          <button id="submit-answer" class="submit-button" type="button">B　こたえる</button>
        </div>
        <p id="puzzle-feedback" class="puzzle-feedback" aria-live="assertive"></p>
      </section>
    </div>

    <div id="clear-screen" class="clear-screen" aria-hidden="true">
      <div class="clear-card" role="dialog" aria-modal="true" aria-labelledby="clear-title">
        <p class="clear-kicker">STAGE 01</p>
        <h2 id="clear-title">CLEAR!</h2>
        <p>ことばをつないで<br />扉をひらいた！</p>
        <div id="clear-letters" class="clear-letters" aria-label="集めた文字"></div>
        <button id="restart-button" class="restart-button" type="button">もういちど遊ぶ</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
